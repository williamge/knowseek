name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR branch cancels the older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The database is a SQLite file (backend/data/, ADR 0030): no service.
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.20"
      - uses: actions/cache@v6
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-${{ runner.os }}-${{ hashFiles('backend/mix.lock') }}
      - run: ../scripts/check-migrations
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix deps.unlock --check-unused
      # sqlite-vec for this runner (linux x86_64), checked against its pinned
      # SHA-256. The next step proves that exqlite loads it on Linux: the
      # migration creates the vec0 table, then the app prints vec_version().
      - run: mix sqlite_vec.fetch
      - name: sqlite-vec through exqlite on Linux
        run: |
          mix do ecto.create --quiet + ecto.migrate --quiet
          mix run -e 'IO.puts("vec_version() = " <> hd(hd(Knowseek.Repo.query!("SELECT vec_version()").rows)))'
      - run: mix test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Builds the release image (backend/Dockerfile). Nothing is pushed.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag knowseek-app:ci backend

  # Each check below has its own job (ADR 0020), so a registry outage in
  # `security` or a failed docs check never hides the test results, and the jobs
  # run in parallel.

  # The migrations a branch adds must roll back and apply again, on an empty
  # database and on one that holds the data of origin/main
  # (scripts/check-migration-roundtrip, on a temporary SQLite file). Needs the
  # full history to find the merge base.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.20"
      - uses: actions/cache@v6
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-${{ runner.os }}-${{ hashFiles('backend/mix.lock') }}
      - run: mix deps.get
      - run: ../scripts/check-migration-roundtrip origin/main

  # Task and ADR numbers, README index rows, Status and Depends on lines,
  # relative markdown links.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-docs

  # shellcheck is preinstalled on ubuntu-latest runners.
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --version
      - run: shellcheck scripts/*

  # Dependency advisories and static security analysis. These steps call
  # hex.pm and the npm registry, so they can fail for reasons outside the
  # repository; that is why they are not part of `backend` or `frontend`.
  # Failure policy: docs/decisions/0020-ci-hardening.md.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.20"
      - uses: actions/cache@v6
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-security-${{ runner.os }}-${{ hashFiles('backend/mix.lock') }}
      - run: mix deps.get
        working-directory: backend
      - name: hex.audit (retired packages)
        run: mix hex.audit
        working-directory: backend
      - name: deps.audit (known advisories in Hex packages)
        if: ${{ !cancelled() }}
        run: mix deps.audit --ignore-file .mix-audit-ignore
        working-directory: backend
      - name: sobelow (Phoenix static security analysis)
        if: ${{ !cancelled() }}
        run: mix sobelow --config
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit (production dependencies, fails at high or critical)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: npm audit (all dependencies, warning only)
        if: ${{ !cancelled() }}
        run: npm audit || echo "::warning::npm audit reports advisories (development dependencies, or below high severity). They do not fail the build. See the log."
        working-directory: frontend

  # gitleaks over the whole git history (.gitleaks.toml), in the official image.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/check-secrets
