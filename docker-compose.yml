# Local infrastructure. One Postgres instance serves every Conductor
# workspace; each workspace uses its own database (see backend/config/dev.exs).
name: knowseek

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The API as a release container (backend/Dockerfile). Not started by
  # `make dev` or `make db-up`: it needs the `app` profile.
  #   docker compose --profile app up --build
  # It creates its own database (APP_DB_NAME) in the db service above, runs the
  # migrations, then serves on http://localhost:${APP_PORT:-4000}. The web UI
  # is not part of the image yet. See docs/decisions/0014-release-and-container.md.
  app:
    profiles: [app]
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-4000}:4000"
    extra_hosts:
      # Lets the container reach a native Ollama on the host (Linux needs this line).
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/${APP_DB_NAME:-knowseek_prod}
      # Local use only. Set SECRET_KEY_BASE (mix phx.gen.secret) for anything else.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-only-insecure-secret-key-base-do-not-use-outside-docker-compose-0123456789}
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: "4000"
      EMBEDDINGS_ADAPTER: ${EMBEDDINGS_ADAPTER:-hashing}
      # APP_OLLAMA_URL, not OLLAMA_URL: a localhost URL in .env is right for
      # `make dev` but means the container itself here.
      OLLAMA_URL: ${APP_OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-}

volumes:
  pgdata:
